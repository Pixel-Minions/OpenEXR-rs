[package]
name = "openexr-rs-deflate"
description = "An exact Rust port of libdeflate 1.26, as OpenEXR 3.5.3 bundles it"
version = "0.1.0+libdeflate.1.26"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
keywords = ["deflate", "zlib", "compression", "openexr"]
categories = ["compression"]
readme = "README.md"
exclude = ["tests/", "examples/"]

[lib]
name = "openexr_deflate"

[features]
# The heavy test tier (PLAN.md §8): tests/heavy_*.rs, run by `cargo xtask gate --full`.
heavy = []

[lints]
workspace = true

[[test]]
name = "heavy_zlib_streams"
required-features = ["heavy"]

[[test]]
name = "heavy_compress_levels"
required-features = ["heavy"]
