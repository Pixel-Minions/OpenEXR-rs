[package]
name = "openexr-rs"
description = "Read and write OpenEXR files safely, over an exact Rust port of OpenEXRCore 3.5.3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
exclude = ["tests/"]

[lib]
name = "openexr"

[dependencies]
openexr-core = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = ["rayon"]
# Threads on request (PLAN.md O12); without it, every request runs single-threaded.
rayon = ["dep:rayon"]
# The heavy test tier (PLAN.md §8): tests/heavy_*.rs, run by `cargo xtask gate --full`.
heavy = []

[lints]
workspace = true

[[test]]
name = "heavy_headers"
required-features = ["heavy"]

[[test]]
name = "heavy_read"
required-features = ["heavy"]

[[test]]
name = "heavy_levels"
required-features = ["heavy"]

[[test]]
name = "heavy_deep"
required-features = ["heavy"]

[[test]]
name = "heavy_write"
required-features = ["heavy"]

[[test]]
name = "heavy_fuzz"
required-features = ["heavy"]
