[package]
name = "openexr-rs-core"
description = "An exact Rust port of OpenEXRCore 3.5.3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "openexr_core"

[dependencies]
openexr-deflate = { workspace = true }
openexr-openjph = { workspace = true }
openexr-zstd = { workspace = true }

[features]
# The heavy test tier (PLAN.md §8): tests/heavy_*.rs, run by `cargo xtask gate --full`.
heavy = []

[lints]
workspace = true

[dev-dependencies]
openexr-testkit = { workspace = true }

[[test]]
name = "heavy_cfmt_crt"
required-features = ["heavy"]

[[test]]
name = "heavy_decode"
required-features = ["heavy"]
